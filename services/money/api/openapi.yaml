openapi: 3.1.0
info:
  title: Sagolik Close money service (internal)
  version: 0.1.0
  description: |
    Internal API reachable only over mutual TLS from allowed workloads
    (e.g. spiffe://sagolik/web). Every /v1 call carries a user assertion:
    an Ed25519 compact JWS (alg EdDSA), at most 60 seconds valid, single use.
    Sagolik Close never holds client funds; balances mirror what the licensed
    escrow partner reports.
servers:
  - url: https://money.internal:8443
security:
  - userAssertion: []
paths:
  /v1/session:
    get:
      summary: Verify the caller's assertion and describe the principal
      responses:
        "200":
          description: Verified caller
          content:
            application/json:
              schema:
                type: object
                required: [userId, aal]
                properties:
                  userId: { type: string, format: uuid }
                  aal: { type: string, enum: [aal1, aal2] }
                  transactionId: { type: string, format: uuid }
                  role: { type: string }
                  stepUpAgeSeconds: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/transactions/{id}/funds:
    get:
      summary: Funds summary for a transaction (audited)
      description: The assertion must be scoped to this transaction and carry a role allowed to view money.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Balances per currency, in cents
          content:
            application/json:
              schema:
                type: object
                required: [transactionId, balances, proofOfFunds]
                properties:
                  transactionId: { type: string, format: uuid }
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
                  proofOfFunds:
                    type: array
                    description: Latest proof-of-funds result per account. Results only, never balances.
                    items: { $ref: "#/components/schemas/ProofOfFunds" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/transactions/{id}/instructions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Payment instruction versions (masked), newest first per purpose
      responses:
        "200":
          description: Versions with derived status
          content:
            application/json:
              schema: { type: object, required: [instructions], properties: { instructions: { type: array, items: { $ref: "#/components/schemas/Instruction" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Record a new version (escrow officer; AAL2 + step-up within 5 minutes)
      description: A changed version is high risk (critical within 72 hours of closing) and gets a cooling-off period before it can be used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, beneficiaryName, bankName, routingNumber, accountNumber, currency]
              additionalProperties: false
              properties:
                purpose: { type: string, enum: [earnest_money_to_escrow, closing_funds_to_escrow, seller_proceeds, loan_payoff] }
                beneficiaryName: { type: string, minLength: 2, maxLength: 140 }
                bankName: { type: string, minLength: 2, maxLength: 140 }
                routingNumber: { type: string, pattern: "^[0-9]{9}$", description: US ABA routing number (checksum validated) }
                accountNumber: { type: string, pattern: "^[0-9 ]{4,20}$" }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                hoursToClosing: { type: number }
      responses:
        "201": { description: Created (masked), content: { application/json: { schema: { type: object, properties: { instruction: { $ref: "#/components/schemas/Instruction" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/instructions/{iid}/verify:
    post:
      summary: Second-person, out-of-band verification (title/escrow officer; not the author; step-up)
      parameters:
        - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              additionalProperties: false
              properties:
                method: { type: string, enum: [out_of_band_call, in_person, provider_attested] }
                reference: { type: string, maxLength: 200 }
      responses:
        "200": { description: Verified, content: { application/json: { schema: { type: object, properties: { instruction: { $ref: "#/components/schemas/Instruction" } } } } } }
        "403": { description: Step-up required, or the caller authored these instructions, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Superseded or already decided, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/instructions/{iid}/reveal:
    post:
      summary: Full wire details for the payer (buyer; verified, past cooling-off, step-up; audited)
      parameters:
        - { name: iid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The only response that carries a full account number
          content:
            application/json:
              schema: { type: object, required: [instruction, accountNumber], properties: { instruction: { $ref: "#/components/schemas/Instruction" }, accountNumber: { type: string } } }
        "403": { description: Step-up required, or inside the cooling-off period, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Not verified or superseded, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/transactions/{id}/ledger/movements:
    post:
      summary: Record what the escrow system shows (escrow officer; step-up; idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount, currency, reference, idempotencyKey]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [expectation, receipt, disbursement] }
                amount: { type: integer, minimum: 1, description: Cents }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                reference: { type: string, minLength: 3, maxLength: 120 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "201": { description: Recorded; returns derived balances }
        "200": { description: Same idempotency key and contents — nothing new recorded }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Key reused with different contents, or payout exceeds funds reported held, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/transactions/{id}/bank-links:
    post:
      summary: Start Plaid Hosted Link (payer only)
      description: Returns Plaid's hosted URL. Plaid sends the person back to the configured redirect URI with ?link={linkId}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { legalName: { type: string, maxLength: 140 } } }
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: { type: object, required: [linkId, hostedLinkUrl, expiresAt], properties: { linkId: { type: string, format: uuid }, hostedLinkUrl: { type: string, format: uri }, expiresAt: { type: string, format: date-time } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/ProviderError" }
        "503": { description: Bank connections aren't configured, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bank-links/{lid}/complete:
    post:
      summary: Finish a Hosted Link session (same person, same transaction; idempotent)
      description: Exchanges the public token, stores the sealed access token, and checks each account's owner names against legalName.
      parameters:
        - { name: lid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [legalName], additionalProperties: false, properties: { legalName: { type: string, minLength: 2, maxLength: 140 } } }
      responses:
        "201": { description: Connected, content: { application/json: { schema: { type: object, properties: { connection: { $ref: "#/components/schemas/BankConnection" } } } } } }
        "200": { description: Already completed; the same connection, content: { application/json: { schema: { type: object, properties: { connection: { $ref: "#/components/schemas/BankConnection" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "link_not_finished, expired, or completed concurrently", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/ProviderError" }
  /v1/transactions/{id}/bank-connections:
    get:
      summary: The caller's own bank connections for this transaction (masked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Connections, content: { application/json: { schema: { type: object, properties: { connections: { type: array, items: { $ref: "#/components/schemas/BankConnection" } } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/bank-connections/{cid}/refresh:
    post:
      summary: Re-check account ownership (owner only)
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [legalName], additionalProperties: false, properties: { legalName: { type: string, minLength: 2, maxLength: 140 } } }
      responses:
        "200": { description: Refreshed, content: { application/json: { schema: { type: object, properties: { connection: { $ref: "#/components/schemas/BankConnection" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "reconnect_required: the person must go through Plaid again", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bank-connections/{cid}/accounts/{aid}/proof-of-funds:
    post:
      summary: Compare a real-time balance with the amount required (owner only; at most 5 per account per hour)
      description: The response includes the balance, for the account owner only. Other parties see the result through /funds.
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: aid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [requiredAmount, currency], additionalProperties: false, properties: { requiredAmount: { type: integer, minimum: 1, description: Cents }, currency: { type: string, pattern: "^[A-Z]{3}$" } } }
      responses:
        "201": { description: Checked, content: { application/json: { schema: { type: object, properties: { fundsCheck: { $ref: "#/components/schemas/FundsCheck" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Disconnected or reconnect required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Checked too often, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bank-connections/{cid}/transactions:
    get:
      summary: Posted transactions on the connection's cash accounts (owner only; needs MONEY_PLAID_OPTIONAL_PRODUCTS to include transactions)
      description: Read for Property Autopilot's payment verification and recurring-cost detection. Nothing is stored; each read is audited.
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 180, default: 120 } }
      responses:
        "200":
          description: Transactions, newest first as Plaid returns them. Pending ones are left out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        accountId: { type: string, format: uuid }
                        date: { type: string, format: date }
                        description: { type: string }
                        amount: { type: integer, description: "Cents; negative = money out" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Disconnected or reconnect required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Product not enabled for this deployment, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bank-connections/{cid}/mortgages:
    get:
      summary: The lender's mortgage figures (owner only; needs MONEY_PLAID_OPTIONAL_PRODUCTS to include liabilities)
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Mortgages (empty when the bank reports none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  mortgages:
                    type: array
                    items:
                      type: object
                      properties:
                        lenderName: { type: [string, "null"] }
                        nextPaymentDueOn: { type: [string, "null"], format: date }
                        nextMonthlyPayment: { type: [integer, "null"], description: Cents }
                        escrowBalance: { type: [integer, "null"], description: Cents }
                        propertyStreet: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Disconnected or reconnect required, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Product not enabled for this deployment, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/bank-connections/{cid}/disconnect:
    post:
      summary: Revoke at Plaid and destroy the access token (owner only; step-up)
      parameters:
        - { name: cid, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object, properties: { connection: { $ref: "#/components/schemas/BankConnection" } } } } } }
        "403": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhooks/plaid:
    post:
      summary: Plaid webhooks (separate listener, MONEY_WEBHOOK_ADDR; no user assertion)
      description: Requires a valid Plaid-Verification JWT (ES256, issued within 5 minutes, SHA-256 of the exact body). Stored once per body.
      security: []
      parameters:
        - { name: Plaid-Verification, in: header, required: true, schema: { type: string } }
      responses:
        "200": { description: Processed, duplicate or ignored }
        "401": { description: Signature check failed }
        "503": { description: Verification key unavailable; Plaid retries }
components:
  securitySchemes:
    userAssertion:
      type: http
      scheme: bearer
      bearerFormat: JWS (EdDSA, 60s, single use)
  schemas:
    Balance:
      type: object
      required: [currency, expected, outstanding, received, disbursed]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        expected: { type: integer, description: Total the buyer has been asked to send to escrow }
        outstanding: { type: integer, description: Still due; negative means more than expected was received }
        received: { type: integer, description: Currently held by escrow, as reported }
        disbursed: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    Instruction:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        purpose: { type: string }
        version: { type: integer }
        previousId: { type: [string, "null"], format: uuid }
        beneficiaryName: { type: string }
        bankName: { type: string }
        routingNumber: { type: string }
        accountMask: { type: string, pattern: "^[0-9]{4}$" }
        currency: { type: string }
        riskLevel: { type: string, enum: [low, medium, high, critical] }
        effectiveAfter: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [pending_verification, verified, rejected, superseded] }
        usable: { type: boolean }
        verifiedBy: { type: [string, "null"], format: uuid }
        verifiedAt: { type: [string, "null"], format: date-time }
        verificationMethod: { type: [string, "null"] }
    BankConnection:
      type: object
      properties:
        id: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        provider: { type: string, enum: [plaid] }
        institutionName: { type: string }
        status: { type: string, enum: [connected, reauthentication_required, expired, revoked, error] }
        statusAt: { type: string, format: date-time }
        consentExpiresAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        accounts: { type: array, items: { $ref: "#/components/schemas/BankAccount" } }
    BankAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        name: { type: string }
        mask: { type: string, maxLength: 4 }
        type: { type: string }
        subtype: { type: string }
        currency: { type: string }
        ownershipMatched: { type: [boolean, "null"] }
        ownershipCheckedAt: { type: [string, "null"], format: date-time }
        lastFundsCheck: { oneOf: [{ $ref: "#/components/schemas/FundsCheck" }, { type: "null" }] }
    FundsCheck:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        checkedBy: { type: string, format: uuid }
        requiredAmount: { type: integer }
        currency: { type: string }
        available: { type: [integer, "null"], description: Cents; returned to the account owner only }
        current: { type: [integer, "null"] }
        sufficient: { type: boolean, description: The available balance covers the amount required }
        checkedAt: { type: string, format: date-time }
    ProofOfFunds:
      type: object
      properties:
        userId: { type: string, format: uuid }
        institutionName: { type: string }
        accountMask: { type: string }
        ownershipMatched: { type: boolean }
        requiredAmount: { type: integer }
        currency: { type: string }
        sufficient: { type: boolean }
        checkedAt: { type: string, format: date-time }
  responses:
    ProviderError:
      description: Plaid failed; the message is written for people
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    StepUpRequired:
      description: The caller must confirm it's them (AAL2 + step-up within 5 minutes)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Missing, invalid, expired or replayed assertion
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown transaction or no access (indistinguishable by design)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
