name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Generated SQL is up to date
        run: pnpm gen:sql && git diff --exit-code -- supabase/migrations

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: bash supabase/tests/run.sh

  database-azure:
    # The Azure flavour on PostgreSQL 16: the migrate command as a non-superuser, the same SQL
    # security suites, then the PostgreSQL store's integration tests as a workload login role.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: bash scripts/postgres-it.sh

  infra:
    # The Azure infrastructure: compiles with no warnings, passes the linter's strict rules
    # (bicepconfig.json), and Checkov on the compiled templates (skips explained in .checkov.yaml).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/azure
    steps:
      - uses: actions/checkout@v4
      - name: Bicep CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bicep" https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build and lint (any warning fails)
        run: |
          set -o pipefail
          mkdir -p out
          for f in main.bicep secrets.bicep; do bicep build "$f" --outdir out 2>&1 | tee -a build.log; bicep lint "$f" 2>&1 | tee -a build.log; done
          for f in modules/*.bicep; do bicep lint "$f" 2>&1 | tee -a build.log; done
          for p in params/*.bicepparam; do DEPLOY_PHASE=apps bicep build-params "$p" --outfile "out/$(basename "$p" .bicepparam).parameters.json" 2>&1 | tee -a build.log; done
          if grep -E "Warning|Error" build.log; then exit 1; fi
      - name: Checkov
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet checkov==3.3.29
          "$RUNNER_TEMP/checkov/bin/checkov" -d out --framework arm --config-file .checkov.yaml --compact --quiet

  images:
    # The three images build, and the web image serves its health check, so a broken Dockerfile
    # shows up here rather than in a deployment.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Web
        run: docker build --target web -t sagolik-web:ci .
      - name: Worker (and the migrate and keys jobs)
        run: docker build --target worker -t sagolik-worker:ci .
      - name: Money service
        run: docker build -t sagolik-money:ci services/money
      - name: Web image serves
        run: |
          docker run -d --name web -p 3000:3000 -e APP_ENV=staging -e DEMO_MODE=true -e SESSION_SECRET="$(openssl rand -hex 32)" -e APP_URL=http://localhost:3000 sagolik-web:ci
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs web; exit 1
      - name: Worker image runs its commands
        run: |
          out="$(docker run --rm sagolik-worker:ci node --import tsx apps/worker/src/keys.ts 2>&1 || true)"
          grep -q "usage: keys" <<<"$out"
          docker run --rm sagolik-money:ci migrate -h

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sagolik/web exec playwright install --with-deps chromium
      # Test the production build (standalone server), not `next dev`: CSP nonces only apply to real builds.
      - name: Build
        run: pnpm --filter @sagolik/web build
        env:
          NEXT_OUTPUT: standalone
      - name: Start production server
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public/. apps/web/.next/standalone/apps/web/public/
          APP_ENV=staging DEMO_MODE=true SESSION_SECRET=$(openssl rand -hex 32) APP_URL=http://localhost:3000 PORT=3000 HOSTNAME=0.0.0.0 node apps/web/.next/standalone/apps/web/server.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  contracts:
    # The deal registry (Solidity), then the Base adapter against a local node running it.
    runs-on: ubuntu-24.04
    env:
      CI_REQUIRE_CHAIN_IT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sagolik/contracts build
      # Includes the check that the ABI and bytecode the app uses match what was compiled here.
      - run: pnpm --filter @sagolik/contracts test
      - run: bash packages/contracts/scripts/integration.sh

  money-service:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/money
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/money/go.mod
          cache-dependency-path: services/money/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go mod verify
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet ./...
      - name: PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Tests (race detector, real Postgres)
        run: ./scripts/test-db.sh
        env:
          CI: "true"
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/money

  money-integration:
    # The web app's services against the real Go money service (mTLS, signed assertions, Postgres).
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: auto
      CI_REQUIRE_MONEY_IT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/money/go.mod
          cache-dependency-path: services/money/go.sum
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: ./services/money/scripts/integration.sh

